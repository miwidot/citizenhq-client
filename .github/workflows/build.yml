# Test-Builds fuer Windows und Linux (scverse #502, erste Stufe).
#
# Jeder Push auf main wird ein GitHub-Release (Tag build-<Laufnummer>). Die Webseite
# verlinkt /releases/latest, zeigt also immer den neuesten Build.
# Noch unsigniert: Windows zeigt SmartScreen ("Unbekannter Herausgeber").
# Signieren und Auto-Update kommen mit scverse #502.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhaengigkeiten fuer Tauri
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Parser-Tests auf dem echten Zielsystem: Pfade und Zeilenenden sind unter
      # Windows anders als auf dem Entwicklerrechner.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib

      - run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: citizenhq-client-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Leerzeichen in Dateinamen machen Download-Links unhandlich
      - run: |
          cd dist
          for f in *; do mv -n "$f" "${f// /_}" 2>/dev/null || true; done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CitizenHQ Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Test-Build von ${{ github.sha }}.
            Windows: .exe (Installer) oder .msi. Nicht signiert, Windows fragt deshalb nach: "Weitere Informationen", dann "Trotzdem ausfuehren".
            Linux: .AppImage oder .deb.
          files: dist/**/*
