# Test-Builds fuer Windows und Linux (scverse #502, erste Stufe).
#
# Ein Release entsteht nur, wenn die Version in src-tauri/tauri.conf.json neu ist
# (Tag v<Version>). Sonst baut und testet der Lauf nur. Die Webseite verlinkt
# /releases/latest, zeigt also immer die neueste Version.
# Noch unsigniert: Windows zeigt SmartScreen ("Unbekannter Herausgeber").
# Signieren und Auto-Update kommen mit scverse #502.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhaengigkeiten fuer Tauri
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Parser-Tests auf dem echten Zielsystem: Pfade und Zeilenenden sind unter
      # Windows anders als auf dem Entwicklerrechner.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib

      - run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: citizenhq-client-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version pruefen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v gibt es schon, kein neues Release."
            echo "neu=false" >> "$GITHUB_OUTPUT"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.neu == 'true'
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.neu == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CitizenHQ ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Windows: .exe (Installer) oder .msi. Noch nicht signiert, Windows fragt deshalb nach: "Weitere Informationen", dann "Trotzdem ausfuehren".
            Linux: .AppImage oder .deb.
          files: dist/**/*
