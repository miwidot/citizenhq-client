[package]
name = "citizenhq-client"
version = "1.1.0"
description = "CitizenHQ Desktop-Client"
edition = "2021"

[lib]
name = "citizenhq_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
